- name: Provisionar base das VMs da Crytto RPG Platform v2
  hosts: all
  become: true

  tasks:
    - name: Instalar dependencias base
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - docker.io
          - docker-compose
          - rsync
        state: present

    - name: Garantir servico Docker ativo
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Adicionar usuario vagrant ao grupo docker
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

    - name: Garantir diretorio da aplicacao
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: vagrant
        group: vagrant
        mode: "0755"

    - name: Sincronizar codigo para diretorio da aplicacao
      ansible.builtin.command:
        cmd: >-
          rsync -a --itemize-changes
          --exclude .git
          --exclude .github
          --exclude node_modules
          --exclude backend/node_modules
          --exclude coverage
          --exclude dist
          --exclude .vagrant
          /vagrant/ {{ app_dir }}/
      register: rsync_sync
      changed_when: rsync_sync.stdout != ""

    - name: Gerar arquivo .env da aplicacao
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: "{{ app_dir }}/.env"
        owner: vagrant
        group: vagrant
        mode: "0644"

- name: Subir banco em VM dedicada
  hosts: db
  become: true

  tasks:
    - name: Subir stack do banco
      ansible.builtin.command:
        cmd: docker-compose -f docker-compose.db.yml up -d
        chdir: "{{ app_dir }}"

    - name: Validar porta do Postgres
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5432
        timeout: 120

- name: Subir aplicacao em VM dedicada
  hosts: app
  become: true

  tasks:
    - name: Subir stack da aplicacao
      ansible.builtin.command:
        cmd: docker-compose -f docker-compose.app.yml up -d --build
        chdir: "{{ app_dir }}"

    - name: Validar backend
      ansible.builtin.uri:
        url: http://localhost:3001/health
        method: GET
        status_code: 200
      register: backend_health
      retries: 20
      delay: 5
      until: backend_health.status == 200

    - name: Validar frontend
      ansible.builtin.uri:
        url: http://localhost/
        method: GET
        status_code: 200
      register: frontend_health
      retries: 20
      delay: 5
      until: frontend_health.status == 200
