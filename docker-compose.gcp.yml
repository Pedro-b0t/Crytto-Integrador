# Implantação na vm-app da GCP (Entrega 2). O banco roda na vm-db (sub-rede privada).
# Variáveis: APP_ENV_FILE (DATABASE_URL etc., gerado pelo startup script) e TLS_DIR (certificado).
name: crytto

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/etc/crytto/app.env}
    environment:
      PORT: "3001"
      HOST: 0.0.0.0
    # Sem "ports": a porta 3001 só é alcançada pelo nginx, na rede interna do Compose.
    expose:
      - "3001"

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-/etc/crytto/tls}:/etc/nginx/tls:ro
